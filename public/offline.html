<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="This page is not available without a network connection. Reconnect and try again." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)" />
    <title>You are offline — Para</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #18181b;
        --muted: #52525b;
        --border: #e4e4e7;
        --accent: #08789f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --border: #27272a;
          --accent: #31c7ff;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 34rem;
      }
      .code {
        font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas,
          monospace;
        font-size: 0.875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.5rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.75rem, 4vw, 2.5rem);
        line-height: 1.2;
      }
      p {
        color: var(--muted);
        margin: 0 0 2rem;
      }
      nav ul {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }
      a {
        display: inline-block;
        padding: 0.6rem 1rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        color: var(--fg);
        text-decoration: none;
        font-weight: 600;
      }
      a:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      button {
        padding: 0.6rem 1rem;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--fg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Offline</p>
      <h1>You are offline</h1>
      <p>
        This page is not available without a network connection. Reconnect and
        try again, or open a page that is already cached.
      </p>
      <nav aria-label="Helpful links">
        <ul>
          <li><a href="/">Home</a></li>
          <li><a href="/docs/">Documentation</a></li>
          <li><button type="button" id="retry">Retry</button></li>
        </ul>
      </nav>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => location.reload());
    </script>
  </body>
</html>
